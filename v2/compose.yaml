services:
  portfolio:
    build:
      context: .
    container_name: portfolio
    network_mode: host
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
